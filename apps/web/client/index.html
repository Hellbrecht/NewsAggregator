<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WaterNews</title>
  </head>
  <body>
    <!--
      This is where React mounts. The <div id="root"> is the anchor point.
      React will inject all UI into this element — the HTML file itself stays minimal.
      Think of it like an empty comp — React fills in all the layers.
    -->
    <div id="root"></div>

    <!--
      Vite injects the compiled JS bundle here automatically.
      In dev: loads directly from Vite's dev server with hot reload.
      In production: becomes a hashed filename like /assets/index-abc123.js
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
