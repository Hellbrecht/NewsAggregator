<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alerts | Water Risk News</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top-nav">
      <div class="top-nav-inner">
        <a class="top-nav-brand" href="/">Water Risk Monitor</a>
        <nav class="top-nav-links" aria-label="Primary navigation">
          <a class="top-nav-link" href="/">News</a>
          <a class="top-nav-link" href="/stocks">Stocks</a>
          <a class="top-nav-link" href="/hydrology">Hydrology Live</a>
          <a class="top-nav-link active" href="/alerts">Alerts</a>
        </nav>
      </div>
    </header>

    <div class="layout single-column">
      <main class="feed alerts-page">
        <header class="feed-header">
          <h1>Alerts</h1>
          <p>High-priority water risk events ranked by current risk score.</p>
          <div class="alerts-controls">
            <label for="alerts-time-range">
              Time
              <select id="alerts-time-range">
                <option value="24h">24h</option>
                <option value="72h" selected>72h</option>
                <option value="7d">7d</option>
                <option value="30d">30d</option>
              </select>
            </label>
            <label for="alerts-min-risk">
              Min Risk
              <select id="alerts-min-risk">
                <option value="50">50+</option>
                <option value="60">60+</option>
                <option value="70" selected>70+</option>
                <option value="80">80+</option>
                <option value="90">90+</option>
              </select>
            </label>
            <label for="alerts-type">
              Type
              <select id="alerts-type">
                <option value="BOTH" selected>Both</option>
                <option value="NEWS">News</option>
                <option value="DATA">Data</option>
              </select>
            </label>
            <label for="alerts-search">
              Search
              <input id="alerts-search" type="search" placeholder="Region, source, keyword..." />
            </label>
            <button id="alerts-refresh-btn" type="button">Refresh</button>
          </div>
          <span id="alerts-status" class="scan-status">Loading alerts...</span>
          <p class="alerts-feedback-note">Downvoted alerts are hidden from this view.</p>
        </header>

        <section id="alerts-summary" class="alerts-summary" aria-label="Alert summary"></section>
        <section id="alerts-list" class="alerts-list" aria-label="Alert list"></section>
        <nav class="alerts-pagination">
          <button id="alerts-load-more-btn" type="button">Load More</button>
        </nav>
      </main>
    </div>

    <script src="/alerts.js" defer></script>
  </body>
</html>
